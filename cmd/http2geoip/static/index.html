<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<title>GeoIP — CERT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   MATERIAL DESIGN 3 — DESIGN TOKENS
══════════════════════════════════════════════════════════════════ */
:root {
  --md-primary:               #9ECAFF;
  --md-on-primary:            #003258;
  --md-primary-container:     #00497D;
  --md-on-primary-container:  #D1E4FF;
  --md-secondary:             #BBC8DA;
  --md-on-secondary:          #263141;
  --md-secondary-container:   #3C4758;
  --md-on-secondary-container:#D7E3F7;
  --md-tertiary:              #4FD8E0;
  --md-on-tertiary:           #00373D;
  --md-tertiary-container:    #004F56;
  --md-on-tertiary-container: #97F0F8;
  --md-error:                 #FFB4AB;
  --md-on-error:              #690005;
  --md-error-container:       #93000A;
  --md-on-error-container:    #FFDAD6;
  --md-success:               #57D9A3;
  --md-success-container:     #00513A;
  --md-on-success-container:  #75F7BC;
  --md-warning:               #FFB74D;
  --md-warning-container:     #5A3900;
  --md-on-warning-container:  #FFD9A0;
  --md-background:               #111318;
  --md-on-background:            #E2E2E6;
  --md-surface:                  #111318;
  --md-on-surface:               #E2E2E6;
  --md-surface-variant:          #43474E;
  --md-on-surface-variant:       #C3C7CF;
  --md-surface-container-lowest: #0C0E11;
  --md-surface-container-low:    #1A1C1E;
  --md-surface-container:        #1E2025;
  --md-surface-container-high:   #28292F;
  --md-surface-container-highest:#33363F;
  --md-outline:         #8D9199;
  --md-outline-variant: #43474E;
  --md-shape-xs:   4px;
  --md-shape-sm:   8px;
  --md-shape-md:   12px;
  --md-shape-full: 100px;
  --md-elev-1: 0 1px 2px rgba(0,0,0,.3),  0 1px 3px 1px rgba(0,0,0,.15);
  --md-elev-2: 0 1px 2px rgba(0,0,0,.3),  0 2px 6px 2px rgba(0,0,0,.15);
  --md-elev-3: 0 1px 3px rgba(0,0,0,.3),  0 4px 8px 3px rgba(0,0,0,.15);
  --md-state-surface-hover: rgba(226,226,230,0.08);
  --md-font:      'Roboto', sans-serif;
  --md-font-mono: 'Roboto Mono', 'Courier New', monospace;
  /* Legacy compat — used in JS inline styles */
  --bg:            var(--md-background);
  --surface:       var(--md-surface-container);
  --border:        var(--md-outline-variant);
  --border-hi:     var(--md-outline);
  --accent:        var(--md-primary);
  --accent2:       var(--md-primary);
  --accent-dim:    var(--md-primary-container);
  --text:          var(--md-on-surface);
  --text-dim:      var(--md-on-surface-variant);
  --text-mid:      var(--md-on-surface-variant);
  --ok:            var(--md-success);
  --ok-dim:        var(--md-success-container);
  --warn:          var(--md-warning);
  --warn-dim:      var(--md-warning-container);
  --err:           var(--md-error);
  --err-dim:       var(--md-error-container);
  --panel-tint:    rgba(158,202,255,0.05);
  --raw-bg:        var(--md-surface-container-lowest);
  --select-opt-bg: var(--md-surface-container-high);
  --focus-ring:    var(--md-primary);
  --mono:          var(--md-font-mono);
  --sans:          var(--md-font);
}
[data-theme="light"] {
  --md-primary:               #0061A4;
  --md-on-primary:            #FFFFFF;
  --md-primary-container:     #D1E4FF;
  --md-on-primary-container:  #001D36;
  --md-secondary:             #535F70;
  --md-on-secondary:          #FFFFFF;
  --md-secondary-container:   #D7E3F7;
  --md-on-secondary-container:#101C2B;
  --md-tertiary:              #006A6B;
  --md-on-tertiary:           #FFFFFF;
  --md-error:                 #BA1A1A;
  --md-on-error:              #FFFFFF;
  --md-error-container:       #FFDAD6;
  --md-on-error-container:    #410002;
  --md-success:               #006C4C;
  --md-success-container:     #8AF5C7;
  --md-on-success-container:  #002115;
  --md-warning:               #7B5000;
  --md-warning-container:     #FFDDB3;
  --md-on-warning-container:  #271900;
  --md-background:               #FAFCFF;
  --md-on-background:            #1A1C1E;
  --md-surface:                  #F8F9FF;
  --md-on-surface:               #1A1C1E;
  --md-surface-variant:          #DFE2EB;
  --md-on-surface-variant:       #43474E;
  --md-surface-container-lowest: #FFFFFF;
  --md-surface-container-low:    #F1F3FA;
  --md-surface-container:        #EBEDF4;
  --md-surface-container-high:   #E5E7EE;
  --md-surface-container-highest:#DFE2E8;
  --md-outline:         #73777F;
  --md-outline-variant: #C3C7CF;
  --md-elev-1: 0 1px 2px rgba(0,0,0,.12), 0 1px 3px 1px rgba(0,0,0,.06);
  --md-elev-2: 0 1px 2px rgba(0,0,0,.12), 0 2px 6px 2px rgba(0,0,0,.06);
  --md-elev-3: 0 1px 3px rgba(0,0,0,.12), 0 4px 8px 3px rgba(0,0,0,.06);
  --md-state-surface-hover: rgba(26,28,30,0.08);
  --panel-tint: rgba(0,97,164,0.05);
  --raw-bg: var(--md-surface-container-lowest);
  --select-opt-bg: var(--md-surface-container-low);
}

/* ══════════════════════════════════════════════════════════════════
   BASE RESET
══════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.skip-link {
  position: absolute; top: -100px; left: 16px; z-index: 9999;
  background: var(--md-primary); color: var(--md-on-primary);
  font-family: var(--md-font); font-size: .875rem; font-weight: 500;
  padding: 10px 24px; border-radius: var(--md-shape-full);
  text-decoration: none; transition: top .2s;
}
.skip-link:focus { top: 8px; }
:focus-visible { outline: 3px solid var(--md-primary); outline-offset: 2px; border-radius: var(--md-shape-xs); }
:focus:not(:focus-visible) { outline: none; }

body {
  background: var(--md-background); color: var(--md-on-background);
  font-family: var(--md-font); font-size: 1rem; line-height: 1.5;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 0 16px 80px;
  transition: background .3s, color .3s;
}

/* ── RTL ── */
[dir="rtl"] .panel-head::before { margin-left: 0; margin-right: 10px; }
[dir="rtl"] .result-time        { margin-inline-start: auto; margin-left: 0; }
[dir="rtl"] .geo-field-label    { text-align: right; }
[dir="rtl"] .geo-table th       { text-align: right; }
[dir="rtl"] .geo-table td       { text-align: right; }
[dir="rtl"] select              { background-position: left 12px center; padding-left: 36px; padding-right: 14px; }

/* ══════════════════════════════════════════════════════════════════
   TOP APP BAR
══════════════════════════════════════════════════════════════════ */
header {
  width: 100%; max-width: 900px;
  padding: 16px 0; display: flex; align-items: center; gap: 16px;
  margin-bottom: 24px; transition: background .3s;
}
.logo-shield { width: 34px; height: 38px; flex-shrink: 0; }
.logo-shield path   { fill: none; stroke: var(--md-primary); stroke-width: 1.5; stroke-linejoin: round; transition: stroke .3s; }
.logo-shield circle { fill: var(--md-primary); opacity: .9; transition: fill .3s; }
.logo-shield line   { stroke: var(--md-primary); stroke-width: 1.5; stroke-linecap: round; transition: stroke .3s; }

.header-text h1 {
  font-family: var(--md-font); font-size: 1.375rem; font-weight: 400;
  color: var(--md-on-surface); transition: color .3s;
}
.header-text p {
  font-size: .75rem; color: var(--md-on-surface-variant);
  letter-spacing: .025em; margin-top: 2px; transition: color .3s;
}
.header-right { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* ── Theme Toggle ── */
.theme-toggle {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--md-surface-container-high); border: none;
  border-radius: var(--md-shape-full); padding: 8px 16px 8px 12px;
  color: var(--md-on-surface-variant);
  transition: background .2s, color .2s; position: relative; overflow: hidden;
}
.theme-toggle::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: var(--md-state-surface-hover); opacity: 0; transition: opacity .2s;
}
.theme-toggle:hover::after, .theme-toggle:focus-visible::after { opacity: 1; }
.theme-toggle:hover { color: var(--md-on-surface); }
.theme-icon { font-size: .9rem; line-height: 1; }
.theme-track { width: 32px; height: 16px; background: var(--md-outline); border-radius: var(--md-shape-full); position: relative; flex-shrink: 0; transition: background .3s; }
.theme-thumb { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--md-surface-container-highest); transition: transform .3s, background .3s; }
[data-theme="light"] .theme-track { background: var(--md-primary); }
[data-theme="light"] .theme-thumb { background: var(--md-on-primary); transform: translateX(16px); }
.theme-label { font-family: var(--md-font); font-size: .6875rem; font-weight: 500; white-space: nowrap; }

/* ── Custom Language Dropdown ── */
.lang-select-wrap { position: relative; }
#lang-select { display: none; }
.lang-btn {
  display: flex; align-items: center; gap: 8px;
  background: var(--md-surface-container-high); border: 1px solid var(--md-outline);
  border-radius: var(--md-shape-xs); color: var(--md-on-surface-variant);
  font-family: var(--md-font); font-size: .875rem; padding: 8px 12px;
  cursor: pointer; outline: none; min-height: 40px;
  transition: border-color .2s, color .2s; position: relative; overflow: hidden; white-space: nowrap;
}
.lang-btn::after { content: ''; position: absolute; inset: 0; background: var(--md-state-surface-hover); opacity: 0; transition: opacity .2s; }
.lang-btn:hover::after, .lang-btn.open::after { opacity: 1; }
.lang-btn:hover, .lang-btn.open { border-color: var(--md-on-surface); color: var(--md-on-surface); }
.lang-btn:focus-visible { border-color: var(--md-primary); border-width: 2px; outline: none; }
.lang-flag-icon { font-size: 1.1rem; line-height: 1; flex-shrink: 0; }
.lang-current-name { font-size: .8125rem; }
.lang-chevron-icon { flex-shrink: 0; color: var(--md-on-surface-variant); transition: transform .2s; }
.lang-btn.open .lang-chevron-icon { transform: rotate(180deg); }
.lang-options {
  position: absolute; top: calc(100% + 4px); right: 0;
  background: var(--md-surface-container-high); border-radius: var(--md-shape-sm);
  box-shadow: var(--md-elev-3); min-width: 220px; max-height: 320px; overflow-y: auto;
  z-index: 1000; padding: 4px 0; list-style: none;
  transform-origin: top right; animation: menuOpen .15s ease-out;
}
@keyframes menuOpen { from { opacity:0;transform:scale(.95) translateY(-4px); } to { opacity:1;transform:scale(1) translateY(0); } }
.lang-options::-webkit-scrollbar { width: 4px; }
.lang-options::-webkit-scrollbar-thumb { background: var(--md-outline-variant); border-radius: 2px; }
.lang-option {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; cursor: pointer;
  font-family: var(--md-font); font-size: .875rem; color: var(--md-on-surface);
  position: relative; user-select: none;
}
.lang-option::after { content: ''; position: absolute; inset: 0; background: var(--md-on-surface); opacity: 0; transition: opacity .12s; }
.lang-option:hover::after { opacity: .08; }
.lang-option[aria-selected="true"] { background: var(--md-primary-container); color: var(--md-on-primary-container); }
.lang-option[aria-selected="true"]::after { display: none; }
.lang-option .lang-flag-icon { font-size: 1.15rem; }

/* ══════════════════════════════════════════════════════════════════
   MAIN LAYOUT
══════════════════════════════════════════════════════════════════ */
main { width: 100%; max-width: 900px; }

/* ── MD3 Elevated Card ── */
.panel { background: var(--md-surface-container); border: none; border-radius: var(--md-shape-md); overflow: hidden; margin-bottom: 16px; box-shadow: var(--md-elev-1); transition: background .3s; }
.panel-head {
  padding: 16px 24px; background: transparent; border-bottom: 1px solid var(--md-outline-variant);
  display: flex; align-items: center; gap: 12px;
  font-family: var(--md-font); font-size: 1rem; font-weight: 500;
  color: var(--md-on-surface); transition: color .3s, border-color .3s;
}
.panel-head::before { content: ''; display: inline-block; width: 3px; height: 20px; background: var(--md-primary); border-radius: var(--md-shape-xs); flex-shrink: 0; transition: background .3s; }
.panel-body { padding: 24px; }

/* ══════════════════════════════════════════════════════════════════
   FORM — MD3 Outlined Fields
══════════════════════════════════════════════════════════════════ */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }

label {
  font-family: var(--md-font); font-size: .75rem; font-weight: 500;
  letter-spacing: .05em; text-transform: uppercase;
  color: var(--md-on-surface-variant); transition: color .3s; cursor: pointer;
}
input, textarea {
  background: transparent; border: 1px solid var(--md-outline);
  border-radius: var(--md-shape-xs); color: var(--md-on-surface);
  font-family: var(--md-font-mono); font-size: .875rem;
  padding: 12px 16px; outline: none; width: 100%;
  appearance: none; -webkit-appearance: none;
  transition: border-color .2s; min-height: 48px;
}
input:hover:not(:focus-visible), textarea:hover:not(:focus-visible) { border-color: var(--md-on-surface); }
input:focus-visible, textarea:focus-visible { border-color: var(--md-primary); border-width: 2px; padding: 11px 15px; outline: none; }
input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--md-error); border-width: 2px; padding: 11px 15px; }
input::placeholder, textarea::placeholder { color: var(--md-on-surface-variant); opacity: .7; }
textarea { resize: vertical; min-height: 110px; line-height: 1.6; }

/* ══════════════════════════════════════════════════════════════════
   IP MODE TABS — MD3 Segmented Button
══════════════════════════════════════════════════════════════════ */
.ip-section { margin-top: 4px; }
.ip-tabs {
  display: flex; border: 1px solid var(--md-outline);
  border-radius: var(--md-shape-full); overflow: hidden;
  margin-bottom: 16px; width: fit-content; transition: border-color .3s;
}
.ip-tab {
  padding: 10px 24px; font-family: var(--md-font); font-size: .875rem; font-weight: 500;
  letter-spacing: .006em; cursor: pointer; border: none; background: transparent;
  color: var(--md-on-surface); transition: background .15s, color .15s;
  user-select: none; min-height: 40px; position: relative; overflow: hidden;
}
.ip-tab + .ip-tab { border-left: 1px solid var(--md-outline); }
.ip-tab::after { content: ''; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
.ip-tab:hover::after { opacity: .08; }
.ip-tab[aria-selected="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.ip-tab:focus-visible { outline: 2px solid var(--md-primary); outline-offset: -2px; z-index: 1; }

.ip-pane { display: none; }
.ip-pane.active { display: block; }

/* MD3 Supporting Text */
.ip-hint { margin-top: 6px; font-family: var(--md-font); font-size: .75rem; color: var(--md-on-surface-variant); transition: color .3s; }

/* ══════════════════════════════════════════════════════════════════
   SUBMIT ROW — MD3 Filled Button
══════════════════════════════════════════════════════════════════ */
.submit-row { margin-top: 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.btn-submit {
  display: flex; align-items: center; gap: 8px;
  background: var(--md-primary); color: var(--md-on-primary); border: none;
  font-family: var(--md-font); font-size: .875rem; font-weight: 500; letter-spacing: .006em;
  padding: 10px 24px; border-radius: var(--md-shape-full); cursor: pointer;
  position: relative; overflow: hidden; transition: box-shadow .2s;
  min-height: 40px; box-shadow: var(--md-elev-1);
}
.btn-submit::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0); transition: background .2s; }
.btn-submit:hover::after { background: rgba(255,255,255,.08); }
.btn-submit:hover { box-shadow: var(--md-elev-2); }
.btn-submit:active { transform: scale(.98); box-shadow: none; }
.btn-submit:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
.btn-submit:focus-visible { outline: 3px solid var(--md-primary); outline-offset: 3px; }
.spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: var(--md-on-primary); border-radius: 50%; animation: spin .7s linear infinite; }
.loading .spinner { display: block; }
.loading .send-icon { display: none; }
.query-hint { font-family: var(--md-font); font-size: .75rem; color: var(--md-on-surface-variant); }
.query-hint[role="alert"] { color: var(--md-warning); }

/* ══════════════════════════════════════════════════════════════════
   RESULTS
══════════════════════════════════════════════════════════════════ */
#results-panel { display: none; }
.result-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }

/* MD3 Status Badges */
.badge {
  font-family: var(--md-font); font-size: .6875rem; font-weight: 500;
  letter-spacing: .05em; text-transform: uppercase;
  padding: 4px 12px; border-radius: var(--md-shape-sm); border: none;
}
.badge-success  { background: var(--md-success-container);  color: var(--md-on-success-container); }
.badge-error    { background: var(--md-error-container);    color: var(--md-on-error-container); }
.badge-notfound { background: var(--md-warning-container);  color: var(--md-on-warning-container); }

.result-query-str { font-family: var(--md-font-mono); font-size: .8125rem; color: var(--md-on-surface-variant); }
.result-time { margin-inline-start: auto; font-family: var(--md-font); font-size: .75rem; color: var(--md-on-surface-variant); }

/* MD3 Outlined Button — Copy CSV */
.btn-copy {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid var(--md-outline);
  border-radius: var(--md-shape-sm); color: var(--md-primary);
  font-family: var(--md-font); font-size: .75rem; font-weight: 500;
  letter-spacing: .005em; padding: 4px 12px; cursor: pointer;
  white-space: nowrap; transition: background .2s, border-color .2s;
  min-height: 32px; position: relative; overflow: hidden;
}
.btn-copy::after { content: ''; position: absolute; inset: 0; background: var(--md-primary); opacity: 0; transition: opacity .2s; }
.btn-copy:hover::after { opacity: .08; }
.btn-copy:hover { border-color: var(--md-primary); }
.btn-copy:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
.btn-copy.copied { background: var(--md-success-container); border-color: transparent; color: var(--md-on-success-container); }
.btn-copy svg { flex-shrink: 0; }

/* ══════════════════════════════════════════════════════════════════
   GEO TABLE — MD3 Data Table
══════════════════════════════════════════════════════════════════ */
.geo-table-wrap { overflow-x: auto; }
.geo-table { width: 100%; border-collapse: collapse; font-family: var(--md-font-mono); font-size: .8125rem; }

.geo-table thead tr { border-bottom: 1px solid var(--md-outline-variant); background: var(--md-surface-container-high); }
.geo-table th {
  text-align: left; padding: 14px 16px;
  font-family: var(--md-font); font-size: .6875rem; font-weight: 500;
  letter-spacing: .05em; text-transform: uppercase;
  color: var(--md-on-surface-variant); white-space: nowrap;
}
.geo-table td {
  padding: 12px 16px; border-bottom: 1px solid var(--md-outline-variant);
  vertical-align: middle; transition: background .15s;
}
.geo-table tr:last-child td { border-bottom: none; }
.geo-table tr:hover td { background: rgba(158,202,255,.06); }
[data-theme="light"] .geo-table tr:hover td { background: rgba(0,97,164,.06); }

/* Not-found row */
.geo-table tr.row-notfound td { opacity: .6; }
.geo-table tr.row-notfound:hover td { background: rgba(90,57,0,.2); }

/* IP cell */
.td-ip { font-weight: 500; color: var(--md-primary); white-space: nowrap; }
.td-ip.notfound { color: var(--md-warning); }
.td-status .badge { display: inline-block; }

/* Stacked cell values */
.cell-main { display: block; }
.cell-sub  { display: block; margin-top: 2px; font-size: .75rem; color: var(--md-on-surface-variant); }
.cell-main.highlight { color: var(--md-success);  font-weight: 500; }
.cell-main.accent    { color: var(--md-primary); }
.cell-main.muted     { color: var(--md-on-surface-variant); }
.cell-main.warn      { color: var(--md-warning); }

.td-notfound-msg { color: var(--md-warning); font-size: .8125rem; opacity: .85; }

/* Misc */
.no-answer { text-align: center; padding: 40px; font-family: var(--md-font); font-size: .875rem; color: var(--md-on-surface-variant); }
.raw-block {
  background: var(--md-surface-container-lowest); border: 1px solid var(--md-outline-variant);
  border-radius: var(--md-shape-sm); padding: 16px 20px;

// ── API lang mapping (UI lang → GeoIP API supported lang) ─────────
const API_LANG_MAP = {
  'ar': 'en', 'bn': 'en', 'de': 'en', 'en': 'en',
  'es': 'es', 'fr': 'fr', 'hi': 'en', 'id': 'en',
  'ja': 'ja', 'ko': 'en', 'pt-BR': 'pt-BR',
  'ru': 'ru', 'ur': 'en', 'vi': 'en', 'zh-CN': 'zh-CN',
};

// ══════════════════════════════════════════════════════════════════
// LANGUAGE DETECTION
// ══════════════════════════════════════════════════════════════════
const SUPPORTED = Object.keys(LANGS);

function detectLang() {
  const navLangs = Array.from(navigator.languages || [navigator.language || 'en']);
  for (const l of navLangs) {
    if (SUPPORTED.includes(l)) return l;
    const base = l.split('-')[0];
    const match = SUPPORTED.find(s => s === base || s.startsWith(base + '-'));
    if (match) return match;
  }
  return 'en';
}

// ══════════════════════════════════════════════════════════════════
// THEME
// ══════════════════════════════════════════════════════════════════
const html       = document.documentElement;
const themeBtn   = document.getElementById('theme-toggle');
const themeLabel = document.getElementById('theme-label');
const themeIcon  = document.getElementById('theme-icon');

let currentLang = 'en';
let isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(isDark);

themeBtn.addEventListener('click', () => { isDark = !isDark; applyTheme(isDark); });
themeBtn.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); themeBtn.click(); }
});

function applyTheme(dark) {
  html.dataset.theme = dark ? 'dark' : 'light';
  themeBtn.setAttribute('aria-checked', dark ? 'false' : 'true');
  const t = LANGS[currentLang] || LANGS.en;
  themeLabel.textContent = dark ? t.themeLight : t.themeDark;
  themeIcon.textContent  = dark ? '☀️' : '🌙';
  themeBtn.setAttribute('aria-label', `${dark ? t.themeLight : t.themeDark} — toggle color theme`);
}

// ══════════════════════════════════════════════════════════════════
// APPLY LANG
// ══════════════════════════════════════════════════════════════════
function applyLang(lang) {
  currentLang = lang;
  const t = LANGS[lang] || LANGS.en;
  const dir = t.dir || 'ltr';

  html.lang = lang; html.dir = dir; document.body.dir = dir;

  const skipLink = document.getElementById('skip-link');
  if (skipLink) skipLink.textContent = t.skipLink || 'Skip to main content';

  document.getElementById('hdr-subtitle').textContent      = t.subtitle;
  document.getElementById('ph-params').textContent         = t.panelParams;
  document.getElementById('lbl-ip-mode').textContent       = t.labelIpMode;
  document.getElementById('tab-single').textContent        = t.tabSingle;
  document.getElementById('tab-multi').textContent         = t.tabMulti;
  document.getElementById('ip-single').placeholder         = t.placeholderSingle;
  document.getElementById('ip-multi').placeholder          = t.placeholderMulti;
  document.getElementById('ip-single-hint').textContent    = t.hintSingle;
  document.getElementById('ip-multi-hint').textContent     = t.hintMulti;
  document.getElementById('btn-send-label').textContent    = t.btnSend;
  document.getElementById('ph-results').textContent        = t.panelResults;

  document.getElementById('lang-select-label').textContent =
    dir === 'rtl' ? 'اللغة' : 'Language';

  applyTheme(isDark);
}

// ── INIT LANGUAGE SELECTOR ────────────────────────────────────────
const langSel  = document.getElementById('lang-select');
const initLang = detectLang();
langSel.value  = SUPPORTED.includes(initLang) ? initLang : 'en';
applyLang(langSel.value);
langSel.addEventListener('change', () => applyLang(langSel.value));

// ══════════════════════════════════════════════════════════════════
// IP MODE TABS
// ══════════════════════════════════════════════════════════════════
let activeTab = 'single';
const ipTabs = Array.from(document.querySelectorAll('.ip-tab'));

ipTabs.forEach(btn => {
  btn.addEventListener('click', () => activateIPTab(btn.dataset.tab, btn));
  btn.addEventListener('keydown', e => {
    const dir = html.dir === 'rtl' ? -1 : 1;
    let idx = ipTabs.indexOf(e.currentTarget);
    if (e.key === 'ArrowRight') { e.preventDefault(); idx = (idx + dir + ipTabs.length) % ipTabs.length; ipTabs[idx].focus(); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); idx = (idx - dir + ipTabs.length) % ipTabs.length; ipTabs[idx].focus(); }
    if (e.key === 'Home') { e.preventDefault(); ipTabs[0].focus(); }
    if (e.key === 'End')  { e.preventDefault(); ipTabs[ipTabs.length - 1].focus(); }
  });
});

function activateIPTab(tabId, btn) {
  activeTab = tabId;
  ipTabs.forEach(b => { b.setAttribute('aria-selected', 'false'); b.tabIndex = -1; });
  document.querySelectorAll('.ip-pane').forEach(p => { p.classList.remove('active'); p.hidden = true; });
  btn.setAttribute('aria-selected', 'true'); btn.tabIndex = 0;
  const pane = document.getElementById('pane-' + tabId);
  pane.classList.add('active'); pane.hidden = false;
}

// ══════════════════════════════════════════════════════════════════
// PARSE IPs FROM INPUT
// ══════════════════════════════════════════════════════════════════
function parseIPs(raw) {
  return raw.split(/[\n,\s]+/).map(s => s.trim()).filter(Boolean);
}

function getRequestedIPs() {
  if (activeTab === 'single') {
    const v = document.getElementById('ip-single').value.trim();
    return v ? [v] : [];
  } else {
    return parseIPs(document.getElementById('ip-multi').value);
  }
}

// ══════════════════════════════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════════════════════════════
const geoForm  = document.getElementById('geo-form');
const btn      = document.getElementById('btn-query');
const hint     = document.getElementById('query-hint');
const srStatus = document.getElementById('sr-status');

geoForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = LANGS[currentLang] || LANGS.en;
  const requestedIPs = getRequestedIPs();

  // Validation
  const singleInput = document.getElementById('ip-single');
  const multiInput  = document.getElementById('ip-multi');
  const activeInput = activeTab === 'single' ? singleInput : multiInput;

  if (!requestedIPs.length) {
    activeInput.focus();
    activeInput.setAttribute('aria-invalid', 'true');
    hint.textContent = t.warnNoIp;
    hint.style.color = 'var(--warn)';
    hint.setAttribute('role', 'alert');
    return;
  }
  activeInput.setAttribute('aria-invalid', 'false');
  hint.textContent = '';
  hint.removeAttribute('role');

  // Build API payload
  const apiLang = API_LANG_MAP[currentLang] || 'en';
  let payload;
  if (requestedIPs.length === 1) {
    payload = { ip: requestedIPs[0], lang: apiLang };
  } else {
    payload = { ips: requestedIPs, lang: apiLang };
  }

  btn.disabled = true;
  btn.classList.add('loading');
  btn.setAttribute('aria-busy', 'true');
  srStatus.textContent = t.loadingLabel || 'Geolocating…';

  const t0 = performance.now();

  try {
    const res = await fetch('/api/v1/geoip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();
    renderResults(data, requestedIPs, elapsed);
    const count = requestedIPs.length;
    srStatus.textContent = t.resultsReady ? t.resultsReady(count) : `${count} result(s).`;
  } catch (err) {
    renderError(err, requestedIPs, ((performance.now() - t0) / 1000).toFixed(2));
    srStatus.textContent = String(err);
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.removeAttribute('aria-busy');
  }
});

// Enter in single IP field
document.getElementById('ip-single').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); geoForm.requestSubmit(); }
});

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════

// Last results state (for CSV export)
let lastAnswers = [];
let lastRequestedIPs = [];

function renderResults(data, requestedIPs, elapsed) {
  const panel = document.getElementById('results-panel');
  const body  = document.getElementById('results-body');
  const t = LANGS[currentLang] || LANGS.en;
  panel.style.display = 'block';

  const status = (data.status || 'ERROR').toUpperCase();

  // Build a map of returned answers by IP
  const answersMap = {};
  if (data.answers && Array.isArray(data.answers)) {
    data.answers.forEach(a => { if (a.ip) answersMap[a.ip] = a; });
  }

  if (status === 'ERROR') {
    lastAnswers = []; lastRequestedIPs = [];
    body.innerHTML = `
      <div class="result-meta">
        <span class="badge badge-error">${t.errBadge}</span>
        <span class="result-query-str">${esc(requestedIPs.join(', '))}</span>
        <span class="result-time">${elapsed}s</span>
      </div>
      <div class="raw-block" role="alert" style="color:var(--err)">${esc(JSON.stringify(data, null, 2))}</div>`;
    finalizePanel(panel);
    return;
  }

  // Store for CSV export
  lastRequestedIPs = requestedIPs;
  lastAnswers = requestedIPs.map(ip => answersMap[ip] || null);

  // Merge: found IPs + NOT FOUND for missing ones
  const totalFound = Object.keys(answersMap).length;
  const badgeClass = totalFound > 0 ? 'badge-success' : 'badge-notfound';
  const badgeTxt   = totalFound > 0 ? 'OK' : t.labelNotFound;

  let rowsHTML = '';
  requestedIPs.forEach(ip => {
    const ans = answersMap[ip];
    if (ans) {
      rowsHTML += buildFoundRow(ans, t);
    } else {
      rowsHTML += buildNotFoundRow(ip, t);
    }
  });

  const queryDisplay = requestedIPs.length === 1
    ? requestedIPs[0]
    : `${requestedIPs.length} IPs`;

  body.innerHTML = `
    <div class="result-meta" role="region" aria-label="${esc(t.panelResults)}">
      <span class="badge ${badgeClass}" aria-label="Status: ${badgeTxt}">${badgeTxt}</span>
      <span class="result-query-str">${esc(queryDisplay)}</span>
      <span class="result-time">${elapsed}s · ${t.replyCount(requestedIPs.length)}</span>
      <button class="btn-copy" id="btn-copy-csv" type="button" aria-label="${esc(t.btnCopy || 'Copy CSV')}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <span id="copy-label">${esc(t.btnCopy || 'Copy CSV')}</span>
      </button>
    </div>
    <div class="geo-table-wrap">
      <table class="geo-table" aria-label="${esc(t.panelResults)}">
        <caption class="visually-hidden">${esc(t.panelResults)}</caption>
        <thead><tr>
          <th scope="col">IP</th>
          <th scope="col">Status</th>
          <th scope="col">${t.colCountry}</th>
          <th scope="col">${t.colRegCountry}</th>
          <th scope="col">${t.colContinent}</th>
          <th scope="col">${t.colCoords}<br><span style="font-size:0.55rem;opacity:0.7">${t.colTimezone}</span></th>
          <th scope="col">${t.colAccuracy}</th>
        </tr></thead>
        <tbody>${rowsHTML}</tbody>
      </table>
    </div>`;

  // Wire up copy button
  document.getElementById('btn-copy-csv').addEventListener('click', copyCSV);

  finalizePanel(panel);
}

function buildFoundRow(ans, t) {
  const continentCode = ans.continent_code || '';
  const continentName = ans.continent_name || '—';
  const countryCode   = ans.country_isocode || '';
  const countryName   = ans.country_name   || '—';
  const regCode       = ans.reg_country_code || '';
  const regName       = ans.reg_country_name || null;
  const lat    = ans.latitude  != null ? fmtCoord(ans.latitude)  : null;
  const lon    = ans.longitude != null ? fmtCoord(ans.longitude) : null;
  const coords = (lat && lon) ? `${lat}, ${lon}` : '—';
  const tz       = ans.time_zone || '—';
  const accuracy = ans.accuracy != null ? `~${ans.accuracy} ${t.km}` : '—';

  // Registered country cell: dim if identical to country, accent if different
  let regCellHTML;
  if (!regName && !regCode) {
    regCellHTML = `<span class="cell-main muted">—</span>`;
  } else {
    const isSame = regCode === countryCode;
    const cls = isSame ? 'cell-main muted' : 'cell-main accent';
    regCellHTML = `
      <span class="${cls}">${esc(regName || '—')}</span>
      ${regCode ? `<span class="cell-sub">${esc(regCode)}</span>` : ''}`;
  }

  return `
    <tr class="row-found" aria-label="${esc(ans.ip)} — ${t.labelFound}">
      <td class="td-ip">${esc(ans.ip)}</td>
      <td class="td-status"><span class="badge badge-success">${t.labelFound}</span></td>
      <td>
        <span class="cell-main highlight">${esc(countryName)}</span>
        ${countryCode ? `<span class="cell-sub">${esc(countryCode)}</span>` : ''}
      </td>
      <td>${regCellHTML}</td>
      <td>
        <span class="cell-main muted">${esc(continentName)}</span>
        ${continentCode ? `<span class="cell-sub">${esc(continentCode)}</span>` : ''}
      </td>
      <td>
        <span class="cell-main accent">${esc(coords)}</span>
        <span class="cell-sub">${esc(tz)}</span>
      </td>
      <td><span class="cell-main muted">${esc(accuracy)}</span></td>
    </tr>`;
}

function buildNotFoundRow(ip, t) {
  return `
    <tr class="row-notfound" aria-label="${esc(ip)} — ${t.labelNotFound}">
      <td class="td-ip notfound">${esc(ip)}</td>
      <td class="td-status"><span class="badge badge-notfound">${t.labelNotFound}</span></td>
      <td colspan="5" class="td-notfound-msg">⊘ &nbsp;${esc(t.notFoundMsg)}</td>
    </tr>`;
}

function renderError(err, requestedIPs, elapsed) {
  const panel = document.getElementById('results-panel');
  const body  = document.getElementById('results-body');
  const t = LANGS[currentLang] || LANGS.en;
  lastAnswers = []; lastRequestedIPs = [];
  panel.style.display = 'block';
  body.innerHTML = `
    <div class="result-meta">
      <span class="badge badge-error">${t.errBadge}</span>
      <span class="result-query-str">${esc(requestedIPs.join(', '))}</span>
      <span class="result-time">${elapsed}s</span>
    </div>
    <div class="raw-block" role="alert" style="color:var(--err)">${esc(String(err))}</div>`;
  finalizePanel(panel);
}

// ── CSV EXPORT ────────────────────────────────────────────────────
function csvField(v) {
  if (v == null || v === '') return '';
  const s = String(v);
  return (s.includes(';') || s.includes('"') || s.includes('\n'))
    ? '"' + s.replace(/"/g, '""') + '"'
    : s;
}

function copyCSV() {
  const t = LANGS[currentLang] || LANGS.en;
  const headers = [
    'ip', 'status',
    'country_name', 'country_isocode',
    'reg_country_name', 'reg_country_code',
    'continent_name', 'continent_code',
    'latitude', 'longitude', 'time_zone',
    'accuracy'
  ].join('|');

  const rows = lastRequestedIPs.map((ip, i) => {
    const ans = lastAnswers[i];
    if (!ans) {
      return [ip, 'NOT_FOUND', '', '', '', '', '', '', '', '', '', ''].join('|');
    }
    return [
      csvField(ans.ip),
      csvField('FOUND'),
      csvField(ans.country_name),
      csvField(ans.country_isocode),
      csvField(ans.reg_country_name),
      csvField(ans.reg_country_code),
      csvField(ans.continent_name),
      csvField(ans.continent_code),
      csvField(ans.latitude),
      csvField(ans.longitude),
      csvField(ans.time_zone),
      csvField(ans.accuracy != null ? ans.accuracy : ''),
    ].join('|');
  });

  const csv = [headers, ...rows].join('\r\n');

  navigator.clipboard.writeText(csv).then(() => {
    const btn = document.getElementById('btn-copy-csv');
    const lbl = document.getElementById('copy-label');
    if (!btn) return;
    btn.classList.add('copied');
    lbl.textContent = t.btnCopied || '✓ Copied';
    btn.setAttribute('aria-label', t.btnCopied || '✓ Copied');
    setTimeout(() => {
      btn.classList.remove('copied');
      lbl.textContent = t.btnCopy || 'Copy CSV';
      btn.setAttribute('aria-label', t.btnCopy || 'Copy CSV');
    }, 2000);
  }).catch(() => {
    // Fallback: textarea trick
    const ta = document.createElement('textarea');
    ta.value = csv; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
  });
}

function finalizePanel(panel) {
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  panel.setAttribute('tabindex', '-1');
  panel.focus({ preventScroll: true });
}

const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function fmtCoord(n) {
  return (Math.round(n * 10000) / 10000).toFixed(4);
}

// ══════════════════════════════════════════════════════════════════
// CUSTOM LANGUAGE DROPDOWN
// ══════════════════════════════════════════════════════════════════
const LANG_META = {
  ar:      { flag: '🇸🇦', name: 'العربية' },
  bn:      { flag: '🇧🇩', name: 'বাংলা' },
  de:      { flag: '🇩🇪', name: 'Deutsch' },
  en:      { flag: '🇬🇧', name: 'English' },
  es:      { flag: '🇪🇸', name: 'Español' },
  fr:      { flag: '🇫🇷', name: 'Français' },
  hi:      { flag: '🇮🇳', name: 'हिन्दी' },
  id:      { flag: '🇮🇩', name: 'Bahasa Indonesia' },
  ja:      { flag: '🇯🇵', name: '日本語' },
  ko:      { flag: '🇰🇷', name: '한국어' },
  'pt-BR': { flag: '🇧🇷', name: 'Português (BR)' },
  ru:      { flag: '🇷🇺', name: 'Русский' },
  ur:      { flag: '🇵🇰', name: 'اردو' },
  vi:      { flag: '🇻🇳', name: 'Tiếng Việt' },
  'zh-CN': { flag: '🇨🇳', name: '中文' },
};
const _langBtn         = document.getElementById('lang-btn');
const _langOptions     = document.getElementById('lang-options');
const _langCurrentFlag = document.getElementById('lang-current-flag');
const _langCurrentName = document.getElementById('lang-current-name');
Object.entries(LANG_META).forEach(([code, meta]) => {
  const li = document.createElement('li');
  li.className = 'lang-option'; li.setAttribute('role','option'); li.setAttribute('aria-selected','false'); li.dataset.value = code;
  li.innerHTML = `<span class="lang-flag-icon">${meta.flag}</span><span>${meta.name}</span>`;
  li.addEventListener('click', e => { e.stopPropagation(); _pickLang(code); _closeLangMenu(); });
  _langOptions.appendChild(li);
});
function _updateLangDisplay(code) {
  const meta = LANG_META[code] || LANG_META.en;
  _langCurrentFlag.textContent = meta.flag; _langCurrentName.textContent = meta.name;
  _langOptions.querySelectorAll('[role=option]').forEach(opt => opt.setAttribute('aria-selected', opt.dataset.value === code ? 'true' : 'false'));
}
function _pickLang(code) { langSel.value = code; _updateLangDisplay(code); applyLang(code); }
function _openLangMenu() {
  _langOptions.hidden = false; _langBtn.setAttribute('aria-expanded','true'); _langBtn.classList.add('open');
  const sel = _langOptions.querySelector('[aria-selected="true"]'); if (sel) sel.scrollIntoView({ block:'nearest' });
}
function _closeLangMenu() { _langOptions.hidden = true; _langBtn.setAttribute('aria-expanded','false'); _langBtn.classList.remove('open'); }
_langBtn.addEventListener('click', e => { e.stopPropagation(); _langOptions.hidden ? _openLangMenu() : _closeLangMenu(); });
_langOptions.addEventListener('keydown', e => {
  const items = Array.from(_langOptions.querySelectorAll('.lang-option')); const idx = items.indexOf(document.activeElement);
  if (e.key==='ArrowDown'){e.preventDefault();items[(idx+1)%items.length].focus();}
  if (e.key==='ArrowUp'){e.preventDefault();items[(idx-1+items.length)%items.length].focus();}
  if (e.key==='Enter'||e.key===' '){e.preventDefault();document.activeElement.click();}
  if (e.key==='Escape'){_closeLangMenu();_langBtn.focus();}
  if (e.key==='Tab') _closeLangMenu();
});
_langBtn.addEventListener('keydown', e => {
  if (e.key==='Escape') _closeLangMenu();
  if ((e.key==='ArrowDown'||e.key==='Enter'||e.key===' ') && _langOptions.hidden) { e.preventDefault(); _openLangMenu(); _langOptions.querySelector('.lang-option')?.focus(); }
});
document.addEventListener('click', _closeLangMenu);
document.addEventListener('keydown', e => { if (e.key==='Escape') _closeLangMenu(); });
_updateLangDisplay(langSel.value);
</script>
